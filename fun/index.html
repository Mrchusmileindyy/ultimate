<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>安全验证</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#0f1420;color:#eef2ff;display:flex;align-items:center;justify-content:center}
.wrap{text-align:center;padding:24px;max-width:520px;width:100%}
.badge{display:inline-block;font-size:12px;letter-spacing:3px;color:#7ee0c0;
  border:1px solid rgba(126,224,192,.35);border-radius:999px;padding:5px 16px;margin-bottom:24px}
h1{font-size:23px;font-weight:600;line-height:1.5;margin-bottom:12px}
p.sub0{font-size:14px;color:#8b96ad;line-height:1.7}
.progress{width:min(72vw,300px);height:6px;border-radius:99px;background:rgba(255,255,255,.1);
  margin:30px auto 10px;overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#5cb8ff,#7ee0c0);transition:width .35s ease}
.plabel{font-size:12px;color:#5b6478;letter-spacing:1px}
.plabel.hot{color:#f5b942;font-weight:600}
#btn{position:fixed;z-index:5;border:0;cursor:pointer;padding:16px 46px;border-radius:14px;
  font-size:18px;font-weight:600;color:#04121a;background:linear-gradient(135deg,#7ee0c0,#5cb8ff);
  box-shadow:0 10px 28px rgba(92,184,255,.32);-webkit-user-select:none;user-select:none;
  transition:left .13s cubic-bezier(.2,.9,.3,1.3),top .13s cubic-bezier(.2,.9,.3,1.3),transform .25s}
.taunt{position:fixed;z-index:4;font-size:13px;font-weight:600;color:#7ee0c0;pointer-events:none;
  animation:fu .9s ease-out forwards}
@keyframes fu{from{opacity:1}to{opacity:0;transform:translateY(-46px)}}
#final{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  background:#0f1420;text-align:center;padding:28px}
#final.on{display:flex}
.big{font-size:27px;font-weight:700;margin-bottom:16px;line-height:1.45}
.stat{font-size:16px;color:#7ee0c0;font-weight:600;margin-bottom:18px}
.sub2{font-size:14px;color:#8b96ad;line-height:1.9}
.again{margin-top:26px;display:inline-block;padding:12px 30px;border-radius:12px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:#eef2ff;font-size:14px;cursor:pointer;text-decoration:none}
.emoji-fly{position:fixed;z-index:9;font-size:26px;pointer-events:none;top:-40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">SECURITY CHECK</div>
  <h1 id="title">请点击下方按钮完成验证</h1>
  <p class="sub0" id="sub">点击「确定」继续访问</p>
  <div class="progress"><i id="pbar"></i></div>
  <div class="plabel" id="plabel">验证进度 0%</div>
</div>

<button id="btn">确 定</button>

<div id="final">
  <div>
    <div class="big" id="big"></div>
    <div class="stat" id="stat"></div>
    <div class="sub2" id="sub2"></div>
    <a class="again" href="">再来一次</a>
  </div>
</div>

<script>
(function(){
  var CONFIG={
    times:25,
    cheer:'加油就差一点宝宝',
    msg:'点得到吗就点',
    tip:'你手速太慢了',
    sign:'回去在练练吧'
  };
  (function(){
    var m=location.search.replace(/^\?/,'').split('&');
    for(var i=0;i<m.length;i++){
      var kv=m[i].split('='), k=decodeURIComponent(kv[0]||''), v=decodeURIComponent((kv[1]||'').replace(/\+/g,' '));
      if(!k||kv.length<2) continue;
      if(k==='times'){ var n=parseInt(v,10); if(n>0) CONFIG.times=n; }
      else if(k in CONFIG) CONFIG[k]=v;
    }
  })();

  var btn=document.getElementById('btn');
  var title=document.getElementById('title');
  var sub=document.getElementById('sub');
  var pbar=document.getElementById('pbar');
  var plabel=document.getElementById('plabel');
  var finalEl=document.getElementById('final');
  var statEl=document.getElementById('stat');
  var startT=performance.now();
  var count=0, lastFlee=0, done=false, cheerShown=false;

  var taunts=['诶？','抓不到我~','嘿嘿','再来','慢一点哦','你行不行啊','差一点点','手速不够','就这？','哎哟~','手滑了','别急嘛','加油鸭','快了快了'];
  var titles=[
    '请点击下方按钮完成验证',
    '哎呀，没点中？',
    '再试一次，你可以的',
    '这个按钮有点调皮',
    '快了快了，就差一点',
    '你是不是有点急了',
    '别急，慢慢来',
    '……你还在追？',
    '它比你想的灵活',
    '再坚持一下下',
    '好吧，它真的累了'
  ];

  function rand(a,b){return a+Math.random()*(b-a);}

  function place(){
    var w=btn.offsetWidth, h=btn.offsetHeight, pad=22;
    btn.style.left=rand(pad,Math.max(pad,innerWidth-w-pad))+'px';
    btn.style.top=rand(pad,Math.max(pad,innerHeight-h-pad))+'px';
  }

  function setInit(){
    var w=btn.offsetWidth, h=btn.offsetHeight;
    btn.style.left=((innerWidth-w)/2)+'px';
    btn.style.top=(innerHeight*0.66)+'px';
  }

  function tauntAt(x,y){
    var el=document.createElement('div');
    el.className='taunt';
    el.textContent=taunts[(Math.random()*taunts.length)|0];
    el.style.left=x+'px';
    el.style.top=y+'px';
    document.body.appendChild(el);
    setTimeout(function(){el.remove();},900);
  }

  function updateProgress(){
    var pct=Math.min(90, Math.round(count/CONFIG.times*100));
    pbar.style.width=pct+'%';
    plabel.textContent='验证进度 '+pct+'%';
    if(pct>=80){
      plabel.classList.add('hot');
      if(!cheerShown){
        cheerShown=true;
        sub.textContent=CONFIG.cheer;
        sub.style.color='#f5b942';
      }
    }
  }

  function flee(x,y){
    var r=btn.getBoundingClientRect();
    tauntAt(x!=null?x:r.left+r.width/2, y!=null?y:r.top);
    count++;
    place();
    var t=titles[Math.min(Math.floor(count/2), titles.length-1)];
    title.textContent=t;
    if(count>=3 && !cheerShown) sub.textContent='（别问，问就是玄学）';
    if(count>=6) btn.style.transform='scale('+Math.max(0.72,1-count*0.02)+')';
    updateProgress();
    if(count>=CONFIG.times){ finish(); return; }
    if(navigator.vibrate) navigator.vibrate(8);
  }

  function tryFlee(x,y){
    if(done) return;
    var now=Date.now();
    var cd=Math.max(110, 250-count*9);
    if(now-lastFlee<cd) return;
    var r=btn.getBoundingClientRect();
    var cx=r.left+r.width/2, cy=r.top+r.height/2;
    var range=100+Math.min(count,12)*4;
    if(Math.hypot(x-cx,y-cy)<range){
      lastFlee=now;
      flee(x,y);
    }
  }

  function finish(){
    done=true;
    var secs=((performance.now()-startT)/1000).toFixed(1);
    btn.style.display='none';
    document.getElementById('big').textContent=CONFIG.msg;
    statEl.textContent='你刚刚认真追了它 '+secs+' 秒 🐷';
    document.getElementById('sub2').innerHTML=CONFIG.tip+'<br>'+CONFIG.sign;
    finalEl.classList.add('on');
    rain();
  }

  function rain(){
    var set=['😂','🐷','🎉','🤣','💖','✨','🐶','🍑','😜'];
    var n=0;
    var timer=setInterval(function(){
      var el=document.createElement('div');
      el.className='emoji-fly';
      el.textContent=set[(Math.random()*set.length)|0];
      el.style.left=rand(0,innerWidth-30)+'px';
      el.style.transition='transform 2.6s linear, opacity 2.6s';
      document.body.appendChild(el);
      requestAnimationFrame(function(){
        el.style.transform='translateY('+(innerHeight+90)+'px) rotate('+rand(-200,200)+'deg)';
        el.style.opacity='0.15';
      });
      setTimeout(function(){el.remove();},2700);
      if(++n>26) clearInterval(timer);
    },90);
  }

  document.addEventListener('mousemove',function(e){ tryFlee(e.clientX,e.clientY); });
  document.addEventListener('touchstart',function(e){
    var t=e.touches[0]; if(t) tryFlee(t.clientX,t.clientY);
  },{passive:true});
  btn.addEventListener('click',function(e){
    e.preventDefault();
    if(!done) tryFlee(e.clientX||innerWidth/2, e.clientY||innerHeight/2);
  });

  window.addEventListener('resize',function(){ if(!done) setInit(); });
  window.addEventListener('load',function(){ setInit(); });
  setInit();
})();
</script>
</body>
</html>
